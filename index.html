<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Ultra Confuso</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="top-warning">⚠️ NÃO CLIQUE EM NADA SEM TER CERTEZA</div>

    <section class="card">
      <div class="tiny-title">sistema_de_cadastro_final_final2</div>
      <h1>Bem-vindo ao cadastro mais simples do mundo</h1>
      <p class="low-contrast">São apenas alguns passos. Provavelmente.</p>

      <div class="fake-progress">
        <span>Etapa 3 de 1</span>
        <div><i></i></div>
      </div>

      <button id="startBtn" class="btn cancel-btn">CANCELAR E COMEÇAR</button>
      <button id="helpBtn" class="help">Não sabe o que fazer? Não clique aqui.</button>

      <p id="indexMessage" class="message"></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
